services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://oficina:oficina@db:5432/oficina
      JWT_SECRET: ${JWT_SECRET:-defina-um-segredo-longo-para-producao}
    depends_on:
      db:
        condition: service_healthy
    # Descomente se quiser aguardar manualmente: command: sh -c "sleep 2 && ..."

volumes: {}
