apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
data:
  APP_ENV: production
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  CORS_ORIGINS: "*"
  EMAIL_ENABLED: "false"
  SMTP_HOST: localhost
  SMTP_PORT: "587"
  EMAIL_FROM: oficina@localhost
  RUN_MIGRATIONS: "false"
