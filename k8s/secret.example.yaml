# Template de Secret da API — NÃO commitar valores reais em produção.
#
# Opção 1: copiar e preencher (arquivo local gitignored)
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# Opção 2: criar via kubectl
#   kubectl create secret generic oficina-secrets -n oficina \
#     --from-literal=DATABASE_URL='postgresql+psycopg2://oficina:oficina@postgres:5432/oficina' \
#     --from-literal=JWT_SECRET='segredo-longo-aleatorio' \
#     --from-literal=WEBHOOK_API_KEY='chave-webhook-producao' \
#     --from-literal=SMTP_USER='' \
#     --from-literal=SMTP_PASSWORD=''
#
# DATABASE_URL aponta para o Service interno postgres (k8s/postgres.yaml).
#
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://oficina:oficina@postgres:5432/oficina"
  JWT_SECRET: "altere-este-segredo-em-producao"
  WEBHOOK_API_KEY: "altere-esta-chave-webhook-em-producao"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
