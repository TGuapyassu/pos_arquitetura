[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-api"
version = "0.1.0"
description = "MVP de gestão de oficina mecânica (DDD + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "mako>=1.3.12",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
    "fpdf2>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Cobertura mínima de 80% nos domínios críticos: núcleo (regras) + casos de uso — ver README.
addopts = "-q --tb=short --cov=app/domain --cov=app/application --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app/domain", "app/application"]
omit = [
  "app/domain/repositories/*",
  "app/**/__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
